<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0F2038" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <g stroke="#1A3A5F" stroke-width="1">
    <!-- Horizontal lines -->
    {% for i in 0..239 %}
      <line x1="0" y1="{{ i * 2.5 }}" x2="100%" y2="{{ i * 2.5 }}" opacity="0.3"/>
    {% endfor %}
    <!-- Vertical lines -->
    {% for i in 0..239 %}
      <line x1="{{ i * 2.5 }}" y1="0" x2="{{ i * 2.5 }}" y2="100%" opacity="0.3"/>
    {% endfor %}
  </g>
</svg>