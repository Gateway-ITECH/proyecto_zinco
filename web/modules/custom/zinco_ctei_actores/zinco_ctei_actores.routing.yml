entity.zincoactor.settings:
  path: 'admin/structure/zincoactor'
  defaults:
    _form: '\Drupal\zinco_ctei_actores\Form\ZincoActorSettingsForm'
    _title: 'ZincoActor'
  requirements:
    _permission: 'administer zincoactor'

entity.actores.collection:
  path: '/admin/structure/actores'
  defaults:
    _entity_list: 'actores'
    _title: 'Actores configuration'
  requirements:
    _permission: 'administer actores'

entity.actores.add_form:
  path: '/admin/structure/actores/add'
  defaults:
    _entity_form: 'actores.add'
    _title: 'Add an actores'
  requirements:
    _permission: 'administer actores'

entity.actores.edit_form:
  path: '/admin/structure/actores/{actores}'
  defaults:
    _entity_form: 'actores.edit'
    _title: 'Edit an actores'
  requirements:
    _permission: 'administer actores'

entity.actores.delete_form:
  path: '/admin/structure/actores/{actores}/delete'
  defaults:
    _entity_form: 'actores.delete'
    _title: 'Delete an actores'
  requirements:
    _permission: 'administer actores'

entity.actors.collection:
  path: '/admin/structure/actors'
  defaults:
    _entity_list: 'actors'
    _title: 'Actors configuration'
  requirements:
    _permission: 'administer actors'

entity.actors.add_form:
  path: '/admin/structure/actors/add'
  defaults:
    _entity_form: 'actors.add'
    _title: 'Add an actors'
  requirements:
    _permission: 'administer actors'

entity.actors.edit_form:
  path: '/admin/structure/actors/{actors}'
  defaults:
    _entity_form: 'actors.edit'
    _title: 'Edit an actors'
  requirements:
    _permission: 'administer actors'

entity.actors.delete_form:
  path: '/admin/structure/actors/{actors}/delete'
  defaults:
    _entity_form: 'actors.delete'
    _title: 'Delete an actors'
  requirements:
    _permission: 'administer actors'

entity.cteiactor.collection:
  path: '/admin/structure/cteiactor'
  defaults:
    _entity_list: 'cteiactor'
    _title: 'CTEIActor configuration'
  requirements:
    _permission: 'administer cteiactor'

entity.cteiactor.add_form:
  path: '/admin/structure/cteiactor/add'
  defaults:
    _entity_form: 'cteiactor.add'
    _title: 'Add a cteiactor'
  requirements:
    _permission: 'administer cteiactor'

entity.cteiactor.edit_form:
  path: '/admin/structure/cteiactor/{cteiactor}'
  defaults:
    _entity_form: 'cteiactor.edit'
    _title: 'Edit a cteiactor'
  requirements:
    _permission: 'administer cteiactor'

entity.cteiactor.delete_form:
  path: '/admin/structure/cteiactor/{cteiactor}/delete'
  defaults:
    _entity_form: 'cteiactor.delete'
    _title: 'Delete a cteiactor'
  requirements:
    _permission: 'administer cteiactor'
