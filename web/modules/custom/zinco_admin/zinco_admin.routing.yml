zinco_admin.settings_form:
  path: '/admin/config/zinco/admin'
  defaults:
    _form: '\Drupal\zinco_admin\Form\ZincoAdminSettingsForm'
    _title: 'Zinco Admin Settings'
  requirements:
    _permission: 'access administration pages'

zinco_admin.dashboard:
  path: '/admin/zinco/dashboard'
  defaults:
    _controller: '\Drupal\zinco_admin\Controller\AdminController::dashboard'
    _title: 'Zinco Admin Dashboard'
  requirements:
    _permission: 'access zinco admin dashboard'
  options:
    _admin_route: TRUE

zinco_admin.dashboard.tab:
  path: '/admin/zinco/dashboard'
  defaults:
    _controller: '\Drupal\zinco_admin\Controller\AdminController::dashboard'
    _title: 'Dashboard'
  requirements:
    _permission: 'access zinco admin dashboard'
  options:
    _admin_route: TRUE
    parameters:
      node:
        type: 'entity:node'
    _parent: 'system.admin_config'
    _tab_parent: 'zinco_admin.settings_form'
    _tab_route: 'zinco_admin.dashboard'

zinco_admin.scrape_news:
  path: '/admin/zinco/scrape-news'
  defaults:
    _controller: '\Drupal\zinco_admin\Controller\AdminController::scrapeNews'
    _title: 'Sincronizar Noticias'
  requirements:
    _permission: 'access administration pages'

zinco_admin.actors_export_page:
  path: '/admin/zinco/actors-export'
  defaults:
    _controller: '\Drupal\zinco_admin\Controller\AdminController::actorsExportPage'
    _title: 'Exportar Datos de Actores CTI'
  requirements:
    _permission: 'access zinco admin dashboard'
  options:
    _admin_route: TRUE