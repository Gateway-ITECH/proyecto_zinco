zinco_etl.gruplac_scraper_form:
  path: '/admin/config/zinco-etl/gruplac-scraper'
  defaults:
    _form: '\Drupal\zinco_etl\Form\GruplacScraperForm'
    _title: 'Gruplac Scraper Configuration'
  requirements:
    _permission: 'administer site configuration'

zinco_etl.actor_import_form:
  path: '/admin/config/zinco-etl/actor-import'
  defaults:
    _form: '\Drupal\zinco_etl\Form\ActorImportForm'
    _title: 'Import Actors'
  requirements:
    _permission: 'administer site configuration'

zinco_etl.settings_form:
  path: '/admin/config/zinco-etl/settings'
  defaults:
    _form: '\Drupal\zinco_etl\Form\SettingsForm'
    _title: 'Zinco ETL Settings'
  requirements:
    _permission: 'administer site configuration'

zinco_etl.cvlac_scraper_form:
  path: '/admin/config/zinco-etl/cvlac-scraper'
  defaults:
    _form: '\Drupal\zinco_etl\Form\CvlacScraperForm'
    _title: 'CvLAC Scraper'
  requirements:
    _permission: 'administer site configuration'

zinco_etl.batch_merge_form:
  path: '/admin/zinco/dashboard/sync'
  defaults:
    _form: '\Drupal\zinco_etl\Form\BatchMergeForm'
    _title: 'Sincronización de Dashboards'
  requirements:
    _permission: 'administer site configuration'

zinco_etl.table_view:
  path: '/admin/zinco/dashboard/view/{table}'
  defaults:
    _controller: '\Drupal\zinco_etl\Controller\TableViewController::view'
    _title: 'Consultar Tabla'
  requirements:
    _permission: 'administer site configuration'

zinco_etl.table_export:
  path: '/admin/zinco/dashboard/export/{table}'
  defaults:
    _controller: '\Drupal\zinco_etl\Controller\TableViewController::export'
  requirements:
    _permission: 'administer site configuration'

zinco_etl.actors_export:
  path: '/admin/zinco/dashboard/export-actors/{bundle}'
  defaults:
    _controller: '\Drupal\zinco_etl\Controller\TableViewController::exportActors'
  requirements:
    _permission: 'administer site configuration'