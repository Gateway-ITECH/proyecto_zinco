zinco_front.home:
  path: '/home'
  defaults:
    _controller: '\Drupal\zinco_front\Controller\ZincoController::home'
    _title: 'Home'
  requirements:
    _permission: 'access content'

zinco_front.dashboard:
  path: '/dashboard'
  defaults:
    _controller: '\Drupal\zinco_front\Controller\ZincoController::dashboard'
    _title: 'Dashboard'
  requirements:
    _permission: 'access content'