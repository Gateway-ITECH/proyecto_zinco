zinco_front.home:
  path: '/home'
  defaults:
    _controller: '\Drupal\zinco_front\Controller\ZincoController::home'
    _title: 'Home'
  requirements:
    _permission: 'access content'

zinco_front.dashboard:
  path: '/dashboard'
  defaults:
    _controller: '\Drupal\zinco_front\Controller\ZincoController::dashboard'
  requirements:
    _permission: 'access content'

zinco_front.perfil_empresas:
  path: '/perfiles/empresas'
  defaults:
    _controller: '\Drupal\zinco_front\Controller\ZincoController::perfil_empresas'
  requirements:
    _permission: 'access content'

zinco_front.perfil_ies:
  path: '/perfiles/ies'
  defaults:
    _controller: '\Drupal\zinco_front\Controller\ZincoController::perfil_ies'
    _title: 'Perfil de IES'
  requirements:
    _permission: 'access content'

zinco_front.perfil_entidades_gobierno:
  path: '/perfiles/entidades-gobierno'
  defaults:
    _controller: '\Drupal\zinco_front\Controller\ZincoController::perfil_entidades_gobierno'
  requirements:
    _permission: 'access content'
zinco_front.dump_data:
  path: '/dump-data/{tableName}/{formato}'
  defaults:
    _controller: '\Drupal\zinco_front\Controller\ZincoController::dumpData'
    _title: 'Dump Data'
    formato: NULL
  requirements:
    _permission: 'access content'

zinco_front.dump_grouped_data:
  path: '/dump-grouped-data/{tableName}/{groupColumn}/{formato}'
  defaults:
    _controller: '\Drupal\zinco_front\Controller\ZincoController::dumpGroupedData'
    _title: 'Dump Grouped Data'
    formato: NULL
  requirements:
    _permission: 'access content'

zinco_front.perfil_investigador:
  path: '/perfiles/investigador'
  defaults:
    _controller: '\Drupal\zinco_front\Controller\ZincoController::perfil_investigador'
  requirements:
    _permission: 'access content'

zinco_front.perfil_grupos_investigacion:
  path: '/perfiles/grupos-investigacion'
  defaults:
    _controller: '\Drupal\zinco_front\Controller\ZincoController::perfil_grupos_investigacion'
  requirements:
    _permission: 'access content'

zinco_front.perfil_parque_tecnologico:
  path: '/perfiles/parque-tecnologico'
  defaults:
    _controller: '\Drupal\zinco_front\Controller\ZincoController::perfil_parque_tecnologico'
  requirements:
    _permission: 'access content'

zinco_front.perfil_agente_financiador:
  path: '/perfiles/agente-financiador'
  defaults:
    _controller: '\Drupal\zinco_front\Controller\ZincoController::perfil_agente_financiador'
  requirements:
    _permission: 'access content'

zinco_front.filter_form:
  path: '/filter-form'
  defaults:
    _form: '\Drupal\zinco_front\Form\ZincoFilterForm'
    _title: 'Filter Form'
  requirements:
    _permission: 'access content'

zinco_front.dump_multiple_grouped_data:
  path: '/dump-multiple-grouped-data/{tableNames}/{groupColumn}/{formato}'
  defaults:
    _controller: '\Drupal\zinco_front\Controller\ZincoController::dumpMultipleGroupedData'
    _title: 'Dump Multiple Grouped Data'
    formato: NULL
  requirements:
    _permission: 'access content'

zinco_front.dashboard_config:
  path: '/admin/config/zinco-front/dashboard'
  defaults:
    _form: '\Drupal\zinco_front\Form\ZincoDashboardConfigForm'
    _title: 'Zinco Dashboard Configuration'
  requirements:
    _permission: 'administer site configuration'

zinco_front.dashboard_config_delete:
  path: '/admin/config/zinco-front/dashboard/delete/{id}'
  defaults:
    _controller: '\Drupal\zinco_front\Controller\ZincoController::deleteDashboardConfigTable'
    _title: 'Delete Dashboard Table'
  requirements:
    _permission: 'administer site configuration'
    id: '\d+'

zinco_front.dashboard_config_delete_filter:
  path: '/admin/config/zinco-front/dashboard/delete-filter/{id}'
  defaults:
    _controller: '\Drupal\zinco_front\Controller\ZincoController::deleteDashboardConfigFilter'
    _title: 'Delete Dashboard Filter'
  requirements:
    _permission: 'administer site configuration'
    id: '\d+'

zinco_front.dump_multiple_data:
  path: '/dump-multiple-data/{tableNames}/{formato}'
  defaults:
    _controller: '\Drupal\zinco_front\Controller\ZincoController::dumpMultipleData'
    _title: 'Dump Multiple Data'
    formato: NULL
  requirements:
    _permission: 'access content'