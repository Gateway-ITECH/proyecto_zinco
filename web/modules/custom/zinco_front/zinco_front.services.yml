services:
  zinco_front.dump_data_service:
    class: Drupal\zinco_front\Service\DumpDataService
    arguments: ['@database', '@config.factory', '@entity_type.manager']
  zinco_front.controller:
    class: Drupal\zinco_front\Controller\ZincoController
    arguments: ['@form_builder', '@zinco_front.dump_data_service', '@config.factory', '@zinco_etl.pdf_generator']
  zinco_front.actores_controller:
    class: Drupal\zinco_front\Controller\ActoresController
    arguments: []
  zinco_front.content_service:
    class: Drupal\zinco_front\Service\ContentService
    arguments: ['@http_client', '@entity_type.manager', '@file_system', '@file_url_generator', '@logger.factory']